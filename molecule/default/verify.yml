---
- name: Verify cluster
  hosts: all
  become: true
  tasks:
    - name: Read cluster state
      ansible.builtin.uri:
        url: "http://{{ ansible_facts['default_ipv4']['address'] }}:8008/cluster"
        return_content: true
      register: __cluster
      run_once: true

    - name: One leader and two streaming replicas
      ansible.builtin.assert:
        that:
          - __cluster.json.members | selectattr('role', 'equalto', 'leader') | list | length == 1
          - __cluster.json.members | selectattr('role', 'equalto', 'replica') | selectattr('state', 'equalto', 'streaming') | list | length == 2
      run_once: true

    - name: Read dynamic configuration
      ansible.builtin.uri:
        url: "http://{{ ansible_facts['default_ipv4']['address'] }}:8008/config"
        return_content: true
      register: __config
      run_once: true

    - name: DCS was patched (value changed, key removed, pg_hba replaced)
      ansible.builtin.assert:
        that:
          - __config.json.postgresql.parameters.work_mem == '32MB'
          - "'wal_keep_size' not in __config.json.postgresql.parameters"
          - __config.json.postgresql.pg_hba | length == 5
      run_once: true

    - name: Effective work_mem on every member
      ansible.builtin.command: psql -XAtq -c "SHOW work_mem"
      become: true
      become_user: postgres
      register: __work_mem
      changed_when: false
      failed_when: __work_mem.stdout != '32MB'

    - name: Leader accepts writes
      ansible.builtin.command: >-
        psql -XAtq -c "CREATE TABLE IF NOT EXISTS molecule(x int); INSERT INTO molecule VALUES (1)"
      become: true
      become_user: postgres
      changed_when: false
      when: inventory_hostname == (__cluster.json.members | selectattr('role', 'equalto', 'leader') | first).name

    - name: Replicas see the write
      ansible.builtin.command: psql -XAtq -c "SELECT count(*) FROM molecule"
      become: true
      become_user: postgres
      register: __read
      until: __read.rc == 0 and __read.stdout | int > 0
      retries: 10
      delay: 2
      changed_when: false

    - name: No Debian-managed cluster runs on its own
      ansible.builtin.shell: |
        set -o pipefail
        ! systemctl is-active --quiet postgresql@15-main
      args:
        executable: /bin/bash
      changed_when: false

    - name: Config file is private
      ansible.builtin.stat:
        path: /etc/patroni/config.yml
      register: __cfg
      failed_when: __cfg.stat.mode != '0600'

    - name: Read start.conf
      ansible.builtin.slurp:
        src: /etc/postgresql/15/main/start.conf
      register: __start_conf

    - name: The start.conf mode is manual and the stock comments are kept
      vars:
        __lines: "{{ (__start_conf.content | b64decode).splitlines() }}"
      ansible.builtin.assert:
        that:
          - __lines | select('match', '^\\s*(auto|manual|disabled)\\s*$') | list == ['manual']
          - "'# Automatic startup configuration' in __lines"
          - "'#   manual: manual startup with pg_ctlcluster/postgresql@.service only' in __lines"
          - "\"# invoke 'systemctl daemon-reload' after editing this file.\" in __lines"

    - name: Read watchdog udev rule
      ansible.builtin.stat:
        path: /etc/udev/rules.d/61-patroni-watchdog.rules
      register: __udev_rule

    - name: Read rendered watchdog mode
      ansible.builtin.slurp:
        src: /etc/patroni/config.yml
      register: __patroni_cfg

    # pg3: watchdog automatic with patroni_watchdog_udev false -> no rule; pg1/pg2: watchdog off -> no rule.
    - name: No udev rule without patroni_watchdog_udev / with watchdog off
      ansible.builtin.assert:
        that:
          - not __udev_rule.stat.exists
          - ((__patroni_cfg.content | b64decode | from_yaml).watchdog.mode | default('off') | string | lower)
            == ('automatic' if inventory_hostname == 'pg3-noble' else 'off')
